[package]
name = "a2a-cli"
version = "0.2.1"
description = "Standalone A2A CLI client"
readme = "README.md"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "a2acli"

[[bin]]
name = "a2acli"
path = "src/main.rs"

[dependencies]
a2a = { workspace = true }
a2a-client = { workspace = true }
async-trait = { workspace = true }
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
futures = { workspace = true }
jsonschema = { version = "0.47.0", default-features = false }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
default = ["rustls-tls"]
native-tls = ["a2a-client/native-tls", "reqwest/native-tls"]
rustls-tls = ["a2a-client/rustls-tls", "reqwest/rustls"]

[dev-dependencies]
a2a-server = { workspace = true }
assert_cmd = "2"
axum = { workspace = true }
base64 = { workspace = true }
