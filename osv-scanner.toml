# Advisories accepted rather than fixed, for osv-scanner and anything built on
# it (OpenSSF Scorecard's Vulnerabilities check runs osv-scanner over the
# lockfiles in this repo).
#
# Cargo.lock is feature-agnostic: it records every optionally-reachable package
# so that enabling a feature later needs no re-resolution. OSV reads the
# lockfile and cannot tell whether a package is actually built, so advisories
# for code this workspace never compiles count against the score as though they
# were reachable. Hence this file.
#
# Every entry expires, so the debt resurfaces instead of being buried. Convention
# follows agntcy/shadi's osv-scanner.toml.
#
# Not listed here, deliberately: RUSTSEC-2026-0285 (rustls). That one is
# reachable — rustls is compiled — and is left visible as the single true
# finding. It is unfixable today because rustls >= 0.23.45 needs aws-lc-rs ^1.18
# while mls-rs-crypto-awslc pins it exactly via agntcy-slim-auth. Tracked in
# #236 and upstream at agntcy/slim#2057. shadi ignores it because it gates CI on
# cargo-audit and would otherwise fail every build; this repo has no such gate,
# so suppressing it here would buy a score and cost the signal.

# --- rust-openssl: not in the resolve graph ----------------------------------
# openssl, openssl-sys, native-tls, hyper-tls and tokio-native-tls are all
# absent from the feature-resolved graph under default features on
# x86_64-unknown-linux-gnu. Both reqwest versions in the tree (0.12.28 via
# oauth2 <- agntcy-slim-auth, and 0.13.4 direct) resolve with __rustls and no
# default-tls, so no TLS backend pulls openssl in.
#
# Verify with:
#   cargo metadata --filter-platform x86_64-unknown-linux-gnu \
#     | jq '.resolve.nodes[].id' | grep openssl   # expect no output
#
# Revisit if anything ever enables reqwest's default-tls feature.

