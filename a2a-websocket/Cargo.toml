[package]
name = "a2a-websocket"
version = "0.1.0"
description = "A2A v1 WebSocket protocol binding for client and server"
readme = "README.md"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "a2a_websocket"

[features]
default = ["tls"]
# Native `wss://` (TLS) client support, built on rustls with the `ring` crypto
# provider (avoids the aws-lc-rs native build).
tls = [
    "dep:tokio-rustls",
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:webpki-roots",
    "dep:rustls-pemfile",
]

[dependencies]
a2a = { workspace = true }
a2a-client = { workspace = true }
a2a-server = { workspace = true }
a2a-pb = { workspace = true }
fastwebsockets = { workspace = true }
axum = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
parking_lot = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
    "logging",
], optional = true }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
webpki-roots = { version = "1", optional = true }
rustls-pemfile = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
tower = { workspace = true }
axum = { workspace = true }
async-trait = { workspace = true }
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["server", "server-auto", "http1", "tokio"] }
rcgen = { version = "0.14", default-features = false, features = ["pem", "crypto", "ring"] }
