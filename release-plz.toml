[workspace]
# Default. `false` makes a failed release unretryable — see #234.
release_always = true
publish_no_verify = true

# Only the CLI ships downloadable artifacts; libraries go to crates.io.
# Tags stay enabled for every crate — see #215.
git_release_enable = false

[[package]]
name = "a2a-cli"
git_release_enable = true
# Owns the root CHANGELOG.md and folds in every other crate's commits, so the
# workspace changelog is generated by the release PR rather than hand-written.
changelog_path = "CHANGELOG.md"
changelog_include = [
    "a2a-lf",
    "a2a-pb",
    "a2a-client-lf",
    "a2a-server-lf",
    "a2a-grpc",
    "a2a-slimrpc",
]
