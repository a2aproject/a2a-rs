name: Release Rust Crates

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'itk/**'
  workflow_dispatch:

# Least privilege by default; jobs that need more raise it themselves.
permissions:
  contents: read

jobs:
  release-crates:
    name: Release crates
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release-plz.outputs.releases_created }}
      releases: ${{ steps.release-plz.outputs.releases }}
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      # crates.io requires Trusted Publishing for these crates, so a stored
      # API token is refused with 403. This exchanges the job's OIDC identity
      # for a token that lives only for this run -- no long-lived registry
      # credential remains in the repository.
      - name: Authenticate to crates.io via Trusted Publishing
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139
        with:
          command: release
          manifest_path: ./Cargo.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # Decides what to distribute from the repository's own state -- the CLI
  # manifest's version, and whether its GitHub release already carries
  # binaries -- rather than from release-plz's outputs. release-crates fails
  # as a whole when any one crate cannot be published, and its outputs are
  # not set then, which used to stop a CLI release that had already been cut
  # from ever getting binaries, a Homebrew formula or WinGet manifests.
  resolve-a2acli-release:
    name: Resolve a2acli release
    needs: release-crates
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Resolve CLI release tag
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("a2acli/Cargo.toml", "rb"))["package"]["version"])')
          tag="a2a-cli-v${version}"

          # An empty tag means nothing to distribute, and skips every job below.
          if ! archives=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
              --jq '[.assets[].name | select(endswith(".sha256"))] | length' 2>/tmp/gh_err); then
            if grep -q "HTTP 404" /tmp/gh_err; then
              echo "No GitHub release for ${tag} yet; nothing to distribute."
              echo "release_tag=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cat /tmp/gh_err >&2
            exit 1
          fi

          if [ "$archives" -gt 0 ]; then
            echo "${tag} already has binaries; nothing to distribute."
            echo "release_tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "${tag} has no binaries yet; distributing."
          echo "release_tag=${tag}" >> "$GITHUB_OUTPUT"

  release-a2acli-binaries:
    name: Release a2acli binaries (${{ matrix.name }})
    needs: resolve-a2acli-release
    if: ${{ !cancelled() && needs.resolve-a2acli-release.outputs.release_tag != '' }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write      # gh release upload
      id-token: write      # cosign keyless signing + provenance, via OIDC
      attestations: write  # actions/attest-build-provenance
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macOS arm64
            runner: macos-26
            target: aarch64-apple-darwin
          - name: macOS x86_64
            runner: macos-26-intel
            target: x86_64-apple-darwin
          - name: Windows x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
    steps:
      # The tag, not the branch head: this can now run after main has moved
      # on, and must not ship newer code under an older version's name.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve-a2acli-release.outputs.release_tag }}

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: ${{ matrix.target }}

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Resolve release metadata
        id: metadata
        shell: bash
        run: |
          python scripts/resolve_a2acli_release_metadata.py \
            --event-name release \
            --release-tag "${{ needs.resolve-a2acli-release.outputs.release_tag }}" \
            --target "${{ matrix.target }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Build a2acli
        run: cargo build -p a2a-cli --release --locked --target ${{ matrix.target }}

      - name: Package release archive
        id: package
        shell: bash
        run: |
          python scripts/package_a2acli_release.py \
            --binary "${{ steps.metadata.outputs.binary_path }}" \
            --target "${{ matrix.target }}" \
            --version "${{ steps.metadata.outputs.version }}" \
            --output-dir dist \
            --github-output "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release archive
        id: sign
        shell: bash
        env:
          ARCHIVE: ${{ steps.package.outputs.archive_path }}
        run: |
          # Keyless: the certificate binds the signature to this workflow's
          # OIDC identity, so there is no private key to hold or rotate.
          #
          # One Sigstore bundle, not the older --output-signature plus
          # --output-certificate pair: cosign v3 defaults --new-bundle-format
          # to true, which ignores both of those and writes to --bundle.
          cosign sign-blob --yes \
            --bundle "${ARCHIVE}.sigstore.json" \
            "$ARCHIVE"
          echo "bundle_path=${ARCHIVE}.sigstore.json" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.archive_path }}

      - name: Name the provenance bundle for the release
        id: provenance_asset
        shell: bash
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          ARCHIVE: ${{ steps.package.outputs.archive_path }}
        run: |
          cp "$BUNDLE" "${ARCHIVE}.intoto.jsonl"
          echo "path=${ARCHIVE}.intoto.jsonl" >> "$GITHUB_OUTPUT"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "${{ steps.metadata.outputs.release_tag }}" \
            "${{ steps.package.outputs.archive_path }}" \
            "${{ steps.package.outputs.checksum_path }}" \
            "${{ steps.sign.outputs.bundle_path }}" \
            "${{ steps.provenance_asset.outputs.path }}" \
            --repo "${{ github.repository }}" \
            --clobber

  release-a2acli-winget:
    name: Publish a2acli WinGet manifests
    needs:
      - resolve-a2acli-release
      - release-a2acli-binaries
    if: ${{ !cancelled() && needs.resolve-a2acli-release.outputs.release_tag != '' && needs.release-a2acli-binaries.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      RELEASE_TAG: ${{ needs.resolve-a2acli-release.outputs.release_tag }}
    steps:
      - name: Trigger WinGet manifest workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run winget-manifests.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}" \
            -f release_tag="$RELEASE_TAG"

  release-a2acli-homebrew:
    name: Publish a2acli Homebrew formula
    needs:
      - resolve-a2acli-release
      - release-a2acli-binaries
    if: ${{ !cancelled() && needs.resolve-a2acli-release.outputs.release_tag != '' && needs.release-a2acli-binaries.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      RELEASE_TAG: ${{ needs.resolve-a2acli-release.outputs.release_tag }}
    steps:
      - name: Trigger Homebrew formula workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run homebrew-formula.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}" \
            -f tag="$RELEASE_TAG"

  release-crates-pr:
    name: Release crates - PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Run release-plz PR
        uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139
        with:
          command: release-pr
          manifest_path: ./Cargo.toml
        env:
          # No registry token: release-pr only opens the version-bump PR and
          # reads public crates.io metadata. It never publishes.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
