name: Publish Project Coverage to Codecov

on:
  # Required checks must report on queue entries too, or every entry stalls.
  # pull_request has no itk path-ignore for the same reason: the merge queue
  # won't accept an entry until every required check has already reported on
  # the PR itself (#280), so an itk-only PR needs a real run here too.
  merge_group:
  push:
    branches: [main]
    paths-ignore:
      - 'itk/**'
  # Stacked PRs target another feature branch and need these checks too.
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Least privilege by default; jobs that need more raise it themselves.
permissions:
  contents: read

# A newer push to a PR cancels its earlier run; other events get their own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Detect code changes
        id: changes
        uses: ./.github/actions/changes

      # Skipped for a docs-only change; see ci.yml.

      - name: Setup Rust
        if: steps.changes.outputs.code == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          # Only main writes; pull requests restore. See ci.yml.
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install just
        if: steps.changes.outputs.code == 'true'
        uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2
        with:
          tool: just

      - name: Install cargo-llvm-cov
        if: steps.changes.outputs.code == 'true'
        uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage report
        if: steps.changes.outputs.code == 'true'
        run: just coverage-lcov

      - name: Upload combined coverage to Codecov
        if: steps.changes.outputs.code == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: coverage/lcov.info
          flags: rust
          name: rust-coverage
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
