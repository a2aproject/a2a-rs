name: Publish Project Coverage to Codecov

on:
  push:
    branches: [main]
    paths-ignore:
      - 'itk/**'
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# Least privilege by default; jobs that need more raise it themselves.
permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          # Only main writes; pull requests restore. See ci.yml.
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install just
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: just

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage report
        run: just coverage-lcov

      - name: Upload combined coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: coverage/lcov.info
          flags: rust
          name: rust-coverage
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}