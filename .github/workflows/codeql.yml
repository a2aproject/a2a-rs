name: CodeQL

on:
  # Required checks must report on queue entries too, or every entry stalls.
  merge_group:
  push:
    branches: [main]
  # Stacked PRs target another feature branch and need these checks too.
  pull_request:
  schedule:
    # Offset from the Scorecard run so the two do not contend for runners.
    - cron: '30 3 * * 6'

permissions:
  contents: read

# A newer push to a PR cancels its earlier run; other events get their own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # Only this job needs to publish findings.
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # Rust is a no-build extractor and rejects any other mode:
          # "Rust does not support the manual build mode. Please try using
          # one of the following build modes instead: none."
          #
          # That also sidesteps `itk`, which panics in its build script
          # without the a2a-itk protos (#207) — nothing is compiled here.
          - language: rust
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: '/language:${{ matrix.language }}'
