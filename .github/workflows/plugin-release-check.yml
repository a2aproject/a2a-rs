name: Build slimrpc plugin release artifacts

# The plugin's release builds only run at release time, so a change that breaks
# one of the five targets would otherwise surface there. This builds, packages
# and runs the plugin on each target, only for changes that can affect it.
on:
  pull_request:
    paths:
      - 'a2acli-transport-slimrpc/**'
      - 'scripts/package_a2acli_release.py'
      - 'scripts/resolve_a2acli_release_metadata.py'
      - 'scripts/install-slimrpc-plugin.ps1'
      - '.github/workflows/plugin-release-check.yml'
      - '.github/workflows/release-upload-binaries.yml'

env:
  CARGO_TERM_COLOR: always

# Least privilege; nothing here writes.
permissions:
  contents: read

jobs:
  build-plugin-release-artifacts:
    name: Plugin ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macOS arm64
            runner: macos-26
            target: aarch64-apple-darwin
          - name: macOS x86_64
            runner: macos-26-intel
            target: x86_64-apple-darwin
          - name: Windows x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: ${{ matrix.target }}
          # No cache: the repo sits at GitHub's cache cap, and a release build
          # of this crate would evict more useful entries.
          cache: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Resolve release metadata
        id: metadata
        shell: bash
        run: |
          python scripts/resolve_a2acli_release_metadata.py \
            --event-name "${{ github.event_name }}" \
            --release-tag "" \
            --package a2acli-transport-slimrpc \
            --target "${{ matrix.target }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Build the plugin
        run: cargo build -p ${{ steps.metadata.outputs.cargo_package }} --release --locked --target ${{ matrix.target }}

      - name: Run the plugin
        # Every runner is native to its target, so the binary can run. `info`
        # needs no configuration or gateway.
        shell: bash
        run: |
          out=$("${{ steps.metadata.outputs.binary_path }}" info)
          echo "$out"
          echo "$out" | grep -q slimrpc

      - name: Package release archive
        id: package
        shell: bash
        run: |
          python scripts/package_a2acli_release.py \
            --binary "${{ steps.metadata.outputs.binary_path }}" \
            --name "${{ steps.metadata.outputs.archive_name }}" \
            --readme "${{ steps.metadata.outputs.readme_path }}" \
            --target "${{ matrix.target }}" \
            --version "${{ steps.metadata.outputs.version }}" \
            --output-dir dist \
            --github-output "$GITHUB_OUTPUT"

      - name: Install with the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ARCHIVE_PATH: ${{ steps.package.outputs.archive_path }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          # Serve the archive the way a GitHub release would, then run the
          # installer against it in Windows PowerShell 5.1 and PowerShell 7,
          # the way users run it: piped to Invoke-Expression.
          $site = Join-Path $env:RUNNER_TEMP 'site'
          $releaseDir = Join-Path $site "a2acli-transport-slimrpc-v$env:VERSION"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          Copy-Item "$env:ARCHIVE_PATH*" $releaseDir
          $server = Start-Process python -NoNewWindow -PassThru -ArgumentList '-m', 'http.server', '8765', '--bind', '127.0.0.1', '--directory', $site
          try {
            for ($i = 0; $i -lt 20; $i++) {
              try { Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:8765/' | Out-Null; break } catch { Start-Sleep -Milliseconds 500 }
            }
            $env:A2A_SLIMRPC_PLUGIN_VERSION = $env:VERSION
            $env:A2A_SLIMRPC_PLUGIN_RELEASE_DOWNLOAD_BASE_URL = 'http://127.0.0.1:8765'
            foreach ($shellName in 'powershell', 'pwsh', 'pwsh') {
              $dir = Join-Path $env:RUNNER_TEMP "install-$shellName"
              $env:A2A_SLIMRPC_PLUGIN_INSTALL_DIR = $dir
              & $shellName -NoProfile -Command 'Get-Content -Raw scripts/install-slimrpc-plugin.ps1 | Invoke-Expression'
              if ($LASTEXITCODE -ne 0) { throw "$shellName installer exited with $LASTEXITCODE" }
              $exe = Join-Path $dir 'a2a-transport-slimrpc.exe'
              if (-not (& $exe info | Select-String -Quiet slimrpc)) { throw "$exe did not report slimrpc" }
              $onPath = @([Environment]::GetEnvironmentVariable('Path', 'User') -split ';' | Where-Object { $_.TrimEnd('\') -ieq $dir })
              if ($onPath.Count -ne 1) { throw "$dir appears $($onPath.Count) times on the user PATH, expected 1" }
            }
          } finally {
            Stop-Process -Id $server.Id -Force
          }

      - name: Upload the archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slimrpc-plugin-${{ matrix.target }}
          path: ${{ steps.package.outputs.archive_path }}
          retention-days: 7
