name: Publish WinGet Manifests

on:
  workflow_call:
    inputs:
      release_tag:
        description: CLI release tag to render into WinGet manifests
        required: true
        type: string
    secrets:
      PROJECT_APP_ID:
        required: false
      PROJECT_APP_KEY:
        required: false
      WINGET_PKGS_PAT:
        required: false
  workflow_dispatch:
    inputs:
      release_tag:
        description: CLI release tag to render into WinGet manifests (e.g. a2a-cli-v0.1.5)
        required: true
        type: string

jobs:
  render-winget-manifests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      manifest_rel_dir: ${{ steps.render.outputs.manifest_rel_dir }}
      package_identifier: ${{ steps.render.outputs.package_identifier }}
      package_version: ${{ steps.render.outputs.package_version }}
      release_url: ${{ steps.render.outputs.release_url }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Render WinGet manifests
        id: render
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/render_winget_manifests.py \
            --tag "$RELEASE_TAG" \
            --output-dir dist/winget \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload WinGet manifest artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: winget-manifests-${{ steps.render.outputs.package_version }}
          path: dist/winget/manifests

  validate-winget-manifests:
    needs: render-winget-manifests
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - name: Download rendered manifests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: winget-manifests-${{ needs.render-winget-manifests.outputs.package_version }}
          path: manifests

      - name: Show winget version
        shell: pwsh
        run: winget --version

      - name: Validate manifests
        shell: pwsh
        env:
          MANIFEST_REL_DIR: ${{ needs.render-winget-manifests.outputs.manifest_rel_dir }}
        run: |
          $dir = Join-Path "manifests" ($env:MANIFEST_REL_DIR -replace '^manifests/', '')
          Get-ChildItem $dir | ForEach-Object { Write-Host $_.Name }
          winget validate --manifest $dir --ignore-warnings
          if ($LASTEXITCODE -ne 0) { throw "winget validate failed with exit $LASTEXITCODE" }

      - name: Install from the manifest and run the command
        shell: pwsh
        env:
          MANIFEST_REL_DIR: ${{ needs.render-winget-manifests.outputs.manifest_rel_dir }}
          CLI: a2acli
        run: |
          function Assert-LastExit($what) {
            if ($LASTEXITCODE -ne 0) { throw "$what failed with exit $LASTEXITCODE" }
          }

          $dir = Join-Path "manifests" ($env:MANIFEST_REL_DIR -replace '^manifests/', '')

          winget settings --enable LocalManifestFiles
          Assert-LastExit "winget settings --enable LocalManifestFiles"

          winget install --manifest $dir `
            --accept-package-agreements --accept-source-agreements --disable-interactivity
          Assert-LastExit "winget install"

          # A runner carries libraries a clean machine does not, so the PATH is
          # cut back to what WinGet and Windows provide before the smoke test.
          $env:PATH = "$env:LOCALAPPDATA\Microsoft\WinGet\Links;$env:SystemRoot\System32;$env:SystemRoot"
          & $env:CLI --help
          Assert-LastExit "$env:CLI --help"
          Write-Host "OK - installed via winget and the binary runs"

  publish-winget-manifests:
    needs: [render-winget-manifests, validate-winget-manifests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      APP_AUTH_CONFIGURED: ${{ secrets.PROJECT_APP_ID != '' && secrets.PROJECT_APP_KEY != '' }}
    steps:
      - name: Download rendered manifests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: winget-manifests-${{ needs.render-winget-manifests.outputs.package_version }}
          path: dist/winget/manifests

      - name: Authenticate with GitHub App Bot
        if: env.APP_AUTH_CONFIGURED == 'true'
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          app-id: ${{ secrets.PROJECT_APP_ID }}
          private-key: ${{ secrets.PROJECT_APP_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Resolve GitHub App Bot user id
        if: ${{ steps.app-token.outputs.token != '' }}
        id: app-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "user_id=$(gh api '/users/${{ steps.app-token.outputs.app-slug }}[bot]' --jq .id)" >> "$GITHUB_OUTPUT"

      - name: Open or update winget-pkgs PR
        env:
          WINGET_PKGS_TOKEN: ${{ secrets.WINGET_PKGS_PAT || steps.app-token.outputs.token }}
          WINGET_PKGS_PAT: ${{ secrets.WINGET_PKGS_PAT }}
          FORK_OWNER: ${{ github.repository_owner }}
          APP_GIT_AUTHOR_NAME: ${{ steps.app-token.outputs.app-slug }}[bot]
          APP_GIT_AUTHOR_EMAIL: ${{ steps.app-user.outputs.user_id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com
          MANIFEST_DIR: ${{ github.workspace }}/dist/winget/${{ needs.render-winget-manifests.outputs.manifest_rel_dir }}
          MANIFEST_REL_DIR: ${{ needs.render-winget-manifests.outputs.manifest_rel_dir }}
          PACKAGE_IDENTIFIER: ${{ needs.render-winget-manifests.outputs.package_identifier }}
          PACKAGE_VERSION: ${{ needs.render-winget-manifests.outputs.package_version }}
          RELEASE_URL: ${{ needs.render-winget-manifests.outputs.release_url }}
        run: |
          if [ -z "$WINGET_PKGS_TOKEN" ]; then
            echo "::notice::Neither WINGET_PKGS_PAT nor PROJECT_APP_ID / PROJECT_APP_KEY are configured; uploaded generated WinGet manifests as a workflow artifact only."
            exit 0
          fi

          export GH_TOKEN="$WINGET_PKGS_TOKEN"
          GH_TOKEN="$WINGET_PKGS_TOKEN" gh auth setup-git >/dev/null

          # GitHub App installation tokens can push to our own fork but cannot
          # open a pull request against microsoft/winget-pkgs, since our app
          # can never be installed on that external repo ("Resource not
          # accessible by integration"). When WINGET_PKGS_PAT (a classic
          # personal access token for a real GitHub user account) is
          # configured, use its identity for the commit and PR instead of the
          # GitHub App bot identity.
          if [ -n "$WINGET_PKGS_PAT" ]; then
            GIT_AUTHOR_NAME="$(gh api user --jq .login)"
            GIT_AUTHOR_EMAIL="$(gh api user --jq .id)+${GIT_AUTHOR_NAME}@users.noreply.github.com"
          else
            GIT_AUTHOR_NAME="$APP_GIT_AUTHOR_NAME"
            GIT_AUTHOR_EMAIL="$APP_GIT_AUTHOR_EMAIL"
          fi

          fork_owner="$FORK_OWNER"

          if ! gh repo view "$fork_owner/winget-pkgs" >/dev/null 2>&1; then
            echo "::error::Expected an existing fork at $fork_owner/winget-pkgs. Create and maintain that fork before running this workflow."
            exit 1
          fi

          rm -rf /tmp/winget-pkgs
          gh repo clone "$fork_owner/winget-pkgs" /tmp/winget-pkgs -- --depth 1

          branch="automation/winget-a2acli-$PACKAGE_VERSION"

          cd /tmp/winget-pkgs
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/microsoft/winget-pkgs.git
          else
            git remote add upstream https://github.com/microsoft/winget-pkgs.git
          fi
          git fetch --depth 1 upstream master
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git checkout -B "$branch" upstream/master

          mkdir -p "$(dirname "$MANIFEST_REL_DIR")"
          rm -rf "$MANIFEST_REL_DIR"
          cp -R "$MANIFEST_DIR" "$(dirname "$MANIFEST_REL_DIR")/"

          git add --all "$MANIFEST_REL_DIR"

          if git diff --cached --quiet -- "$MANIFEST_REL_DIR"; then
            echo "WinGet manifests are already up to date for $RELEASE_TAG"
            exit 0
          fi

          git commit -m "release: add WinGet manifest for a2acli v$PACKAGE_VERSION"
          git push --force --set-upstream origin "$branch"

          pr_number=$(gh pr list --repo microsoft/winget-pkgs --head "$fork_owner:$branch" --base master --state open --json number --jq 'first(.[].number) // ""')
          if [ -n "$pr_number" ]; then
            echo "Updated existing PR #$pr_number"
            exit 0
          fi

          cat > /tmp/winget-pr-body.md <<EOF
          Add WinGet manifests for $PACKAGE_IDENTIFIER $PACKAGE_VERSION.

          - publishes the Windows portable ZIP for a2acli
          - points WinGet at the a2a-rs GitHub release asset and checksum-backed digest
          - generated from the a2a-rs CLI release automation

          Upstream release: $RELEASE_URL
          EOF

          if ! gh pr create \
            --repo microsoft/winget-pkgs \
            --base master \
            --head "$fork_owner:$branch" \
            --title "Add WinGet manifest for a2aproject.a2acli version $PACKAGE_VERSION" \
            --body-file /tmp/winget-pr-body.md 2>&1 | tee /tmp/gh-pr-create.log; then
            if grep -q "already exists" /tmp/gh-pr-create.log; then
              echo "PR already exists for $branch — branch updated in place"
              exit 0
            fi
            if [ -z "$WINGET_PKGS_PAT" ]; then
              echo "::error::Failed to open the winget-pkgs pull request using the GitHub App token. GitHub Apps cannot open pull requests on repositories they aren't installed on (microsoft/winget-pkgs), which blocks this final step. Configure a WINGET_PKGS_PAT secret (classic PAT, public_repo scope, from a maintainer account with a winget-pkgs fork) to complete publishing."
            fi
            exit 1
          fi
