name: CLI Plugin Interop

on:
  pull_request:
    paths:
      - 'a2acli-transport-slimrpc/**'
      - 'a2a-slimrpc/**'
      - 'a2a-grpc/**'
      - 'a2a-pb/**'
      - 'a2a/**'
      - 'a2a-client/**'
      - 'a2a-server/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/slimrpc_interop.py'
      - 'scripts/test_slimrpc_interop.py'
      - '.github/workflows/cli-plugin-interop.yml'
  push:
    branches:
      - main
    paths:
      - 'a2acli-transport-slimrpc/**'
      - 'a2a-slimrpc/**'
      - 'a2a-grpc/**'
      - 'a2a-pb/**'
      - 'a2a/**'
      - 'a2a-client/**'
      - 'a2a-server/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/slimrpc_interop.py'
      - 'scripts/test_slimrpc_interop.py'
      - '.github/workflows/cli-plugin-interop.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Least privilege by default; nothing is published from this job.
permissions:
  contents: read

# A newer push to a PR cancels its earlier run; other events get their own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  cli-plugin-interop:
    name: a2a-cli plugin discovery and live round trip
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-save-if: false

      - name: Check response assertions
        run: python3 -m unittest discover -s scripts -p test_slimrpc_interop.py -v

      - name: Build the slimrpc transport plugin
        run: cargo build -p a2acli-transport-slimrpc --locked

      - name: Download the a2a-cli release binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/a2a-cli"
          gh release download v0.4.0 --repo a2aproject/a2a-cli \
            --pattern '*_linux_amd64.tar.gz' \
            --dir "$RUNNER_TEMP/a2a-cli" \
            --clobber
          tar -xzf "$RUNNER_TEMP"/a2a-cli/*_linux_amd64.tar.gz -C "$RUNNER_TEMP/a2a-cli"

      - name: Put a2a and the plugin on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 target/debug/a2a-transport-slimrpc "$RUNNER_TEMP/bin/"
          install -m 0755 "$RUNNER_TEMP/a2a-cli/a2a" "$RUNNER_TEMP/bin/"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: a2a-cli discovers the slimrpc plugin
        # `a2a transport list` launches every plugin's `info` subcommand and
        # renders its metadata as a table; the plugin never needs a SLIM
        # gateway for this. Real slimrpc/1.0.0 metadata surfacing through the
        # real a2a-cli binary is the actual thing this job proves.
        run: |
          a2a transport list | tee transport-list.txt
          grep -qE '^slimrpc\s' transport-list.txt

      - name: a2a-cli surfaces the plugin's real startup error
        # Without $A2A_SLIMRPC_PLUGIN_CONFIG, `serve` fails immediately.
        # a2a-cli reads a single JSON handshake line from the plugin's
        # stdout to learn this; without one, it reports a bare "reading
        # handshake: EOF" instead of the plugin's actual error. Asserting on
        # our specific message (not just a nonzero exit) is what would catch
        # a regression back to that generic failure.
        #
        # This step intentionally runs a command expected to fail, and
        # PASSES when it fails with the right message -- the "Error: ..."
        # line below is the expected assertion target, not a build failure.
        run: |
          echo "::notice::The following 'a2a send' failure is expected -- no SLIM gateway is configured in this job. This step passes if the error names A2A_SLIMRPC_PLUGIN_CONFIG (our real cause), and fails if it doesn't (e.g. a regression to a generic EOF)."
          set +e
          output=$(a2a send --transport slimrpc --endpoint org/namespace/agent "hello" 2>&1)
          exit_code=$?
          set -e
          echo "$output"
          [ "$exit_code" -ne 0 ]
          echo "$output" | grep -q 'A2A_SLIMRPC_PLUGIN_CONFIG'

      - name: Checkout the Go echo agent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: agntcy/slim-a2a-go
          ref: 7744bf6f2c78f00f7c87e96894346b0762adeb4f # v0.5.2
          path: .interop/slim-a2a-go
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .interop/slim-a2a-go/go.mod
          cache: false

      - name: Build the Go echo agent
        working-directory: .interop/slim-a2a-go
        run: |
          # Resolve the native setup tool from this checkout's go.mod.
          go run github.com/agntcy/slim-bindings-go/v3/cmd/slim-bindings-setup
          CGO_ENABLED=1 go build -o "$RUNNER_TEMP/bin/slimrpc-echo-agent" ./examples/echo_agent/cmd/server

      - name: Test unary and streaming sends through a live gateway
        env:
          A2A_SLIMRPC_PLUGIN_CONFIG: ${{ github.workspace }}/a2acli-transport-slimrpc/examples/plugin.yaml
        run: |
          mkdir -p interop-logs
          gateway="a2a-slimrpc-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          agent_pid=""
          cleanup() {
            if [ -n "$agent_pid" ]; then
              kill "$agent_pid" 2>/dev/null || true
              wait "$agent_pid" 2>/dev/null || true
            fi
            docker logs "$gateway" > interop-logs/gateway.log 2>&1 || true
            docker rm -f "$gateway" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d --name "$gateway" \
            -p 127.0.0.1:46357:46357 \
            -v "$PWD/a2acli-transport-slimrpc/examples/slim-gateway.yaml:/config.yaml:ro" \
            ghcr.io/agntcy/slim:3.4.6 /slim --config /config.yaml
          # Bound startup separately from the actual test; sends are not retried.
          python3 - <<'PYREADY'
          import socket
          import time
          for attempt in range(60):
              try:
                  with socket.create_connection(("127.0.0.1", 46357), timeout=1):
                      break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit("SLIM gateway did not become ready")
          PYREADY
          GOLANG_PROTOBUF_REGISTRATION_CONFLICT=warn \
            slimrpc-echo-agent --a2a-version v1 --slim-endpoint http://127.0.0.1:46357 \
            > interop-logs/agent.log 2>&1 &
          agent_pid=$!
          for attempt in $(seq 1 60); do
            kill -0 "$agent_pid" 2>/dev/null || { cat interop-logs/agent.log; exit 1; }
            if grep -q 'echo agent ready' interop-logs/agent.log; then
              break
            fi
            sleep 1
          done
          grep -q 'echo agent ready' interop-logs/agent.log
          python3 scripts/slimrpc_interop.py --output-dir interop-logs

      - name: Upload interop logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slimrpc-interop-logs
          path: interop-logs/
          if-no-files-found: ignore
          retention-days: 7
