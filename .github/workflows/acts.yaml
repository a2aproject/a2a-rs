name: ACTS

on:
  push:
    branches: [main]
  pull_request:
    # The crates the `itk` agent links (see itk/Cargo.toml), plus the agent
    # and the SUT behaviour contract the runner gates the corpus on.
    paths:
      - 'a2a/**'
      - 'a2a-client/**'
      - 'a2a-grpc/**'
      - 'a2a-pb/**'
      - 'a2a-server/**'
      - 'itk/**'
      - 'acts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      # Self-callout: re-run when this workflow changes so YAML edits are
      # validated in PRs.
      - '.github/workflows/acts.yaml'

# Least privilege by default; nothing is published until the nightly.
permissions:
  contents: read

concurrency:
  group: acts-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  acts:
    name: ACTS Conformance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Clone a2a-itk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: a2aproject/a2a-itk
          ref: main
          path: itk/a2a-itk

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build itk_service image (GHA layer cache)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: itk/a2a-itk
          tags: itk_service:latest
          load: true
          cache-from: type=gha,scope=itk_service
          cache-to: type=gha,mode=max,scope=itk_service

      - name: Cache launcher peer-SDK checkouts + build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/a2a-itk-launcher
          key: itk-launcher-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            itk-launcher-${{ runner.os }}-

      - name: Run ACTS Conformance Suite
        # Temporarily advisory: the driver gates on `must` conformance here,
        # which no SDK passes yet. Delete this line to make it a merge
        # requirement.
        continue-on-error: true
        run: bash run_itk.sh
        working-directory: itk
        env:
          A2A_ITK_REVISION: main
          ITK_ACTS_RUN: "1"
          ITK_ACTS_TRANSPORTS: jsonrpc,grpc,rest
          ITK_SKIP_BUILD: "1"

      - name: Upload ACTS reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acts-reports-rust
          path: itk/acts-report-*.json
          if-no-files-found: warn
          retention-days: 14
