name: CI

on:
  # Required checks must report on queue entries too, or every entry stalls.
  merge_group:
  pull_request:
    paths-ignore:
      - 'itk/**'
  # Also on main: the badge reports the newest run on the default branch, a
  # squash merge can produce a tree no pull request ever built (#208), and a
  # cache is scoped to the ref that created it — so without this, every
  # build-test cache is pull-request-scoped and no pull request can share one.
  push:
    branches:
      - main
    paths-ignore:
      - 'itk/**'

env:
  CARGO_TERM_COLOR: always

# Least privilege by default; jobs that need more raise it themselves.
permissions:
  contents: read

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: clippy, rustfmt
          # Only main writes; pull requests restore from it. The repo sits at
          # 9.6 of GitHub's 10 GiB cache cap and evicts within hours.
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install just
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: just

      - name: Check lockfile is up to date
        # `--locked` fails if Cargo.lock would need changing. The release
        # workflows already build with `--locked`, so a lockfile that drifts
        # on main breaks every pull request's release-binary job.
        #
        # `shell: bash` because the windows runner defaults to pwsh, where
        # `/dev/null` is an ordinary path and the redirect fails on the
        # missing `C:\dev` directory.
        shell: bash
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Check compilation
        run: just check-compile

      - name: Check formatting
        if: runner.os == 'Linux'
        run: just fmt-check

      - name: Clippy lints
        run: just lint

      - name: Run tests
        run: just test

      - name: Check copyright headers
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          missing=0
          for f in $(find . -name '*.rs' -not -path '*/gen/*' -not -path '*/target/*'); do
            if ! head -1 "$f" | grep -q '^// Copyright AGNTCY' \
               || ! sed -n 2p "$f" | grep -q '^// Copyright A2A Contributors'; then
              echo "Missing header: $f"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "ERROR: $missing file(s) missing copyright header"
            exit 1
          fi
