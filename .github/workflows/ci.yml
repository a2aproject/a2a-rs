name: CI

on:
  pull_request:
    paths-ignore:
      - 'itk/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: clippy, rustfmt

      - name: Install just
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2
        with:
          tool: just

      - name: Check compilation
        run: just check-compile

      - name: Check formatting
        if: runner.os == 'Linux'
        run: just fmt-check

      - name: Clippy lints
        run: just lint

      - name: Run tests
        run: just test

      - name: Check copyright headers
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          missing=0
          for f in $(find . -name '*.rs' -not -path '*/gen/*' -not -path '*/target/*'); do
            if ! head -1 "$f" | grep -q '^// Copyright AGNTCY'; then
              echo "Missing header: $f"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "ERROR: $missing file(s) missing copyright header"
            exit 1
          fi
