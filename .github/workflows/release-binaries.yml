name: Build a2acli Release Artifacts

on:
  pull_request:
    paths-ignore:
      - 'itk/**'
  push:
    branches:
      - main
    paths-ignore:
      - 'itk/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-a2acli-release-artifacts:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macOS arm64
            runner: macos-26
            target: aarch64-apple-darwin
          - name: macOS x86_64
            runner: macos-26-intel
            target: x86_64-apple-darwin
          - name: Windows x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: ${{ matrix.target }}

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Resolve release metadata
        id: metadata
        shell: bash
        run: |
          python scripts/resolve_a2acli_release_metadata.py \
            --event-name "${{ github.event_name }}" \
            --release-tag "" \
            --target "${{ matrix.target }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Build a2acli
        run: cargo build -p a2a-cli --release --locked --target ${{ matrix.target }}

      - name: Package release archive
        id: package
        shell: bash
        run: |
          python scripts/package_a2acli_release.py \
            --binary "${{ steps.metadata.outputs.binary_path }}" \
            --target "${{ matrix.target }}" \
            --version "${{ steps.metadata.outputs.version }}" \
            --output-dir dist \
            --github-output "$GITHUB_OUTPUT"
