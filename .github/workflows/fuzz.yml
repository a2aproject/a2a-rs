name: Fuzz

on:
  pull_request:
    paths-ignore:
      - 'itk/**'
  push:
    branches:
      - main
    paths-ignore:
      - 'itk/**'

# Least privilege; nothing here writes.
permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    # cargo-fuzz needs nightly and does not support Windows, so this stays out
    # of the stable CI matrix — see #238.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - sse_framing
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust nightly
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: nightly
          # This action defaults RUSTFLAGS to "-D warnings"; cargo-fuzz appends
          # its own instrumentation flags and an instrumented build of every
          # dependency should not fail on someone else's warning.
          rustflags: ''
          # The repo sits near GitHub's 10 GiB cache cap and evicts hourly, so
          # only main writes a cache; pull requests still restore from it.
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-workspaces: fuzz

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: cargo-fuzz

      - name: Fuzz ${{ matrix.target }}
        working-directory: fuzz
        run: |
          mkdir -p corpus/${{ matrix.target }}
          # --target is explicit: install-action ships the musl prebuilt of
          # cargo-fuzz, which otherwise defaults --target to musl, and ASan
          # cannot link against a statically linked libc.
          cargo fuzz run \
            --target x86_64-unknown-linux-gnu \
            ${{ matrix.target }} \
            corpus/${{ matrix.target }} \
            seeds/${{ matrix.target }} \
            -- -max_total_time=60 -print_final_stats=1

      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
