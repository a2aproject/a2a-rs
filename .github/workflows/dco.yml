name: DCO

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Signed-off-by on every commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Need the full range between base and head, not just the tip.
          fetch-depth: 0

      # Implemented here rather than with a third-party action: the check is
      # a dozen lines of git, and a security workflow should not add a
      # supply-chain dependency to assert a trailer is present.
      - name: Verify Developer Certificate of Origin
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          set -euo pipefail

          git fetch --no-tags --quiet origin "$BASE_REF"

          # Range against the base branch as it stands now, not against
          # github.event.pull_request.base.sha. --no-merges drops a merge
          # commit but not the commits it brought in, so a contributor who
          # merges the base branch into their branch would otherwise have
          # every upstream commit in that merge attributed to them. Excluding
          # everything reachable from the base branch cannot do that,
          # whatever the event's base snapshot happens to say.
          commits=$(git rev-list --no-merges "origin/$BASE_REF".."$HEAD_SHA")
          if [ -z "$commits" ]; then
            echo "No non-merge commits to check."
            exit 0
          fi

          failed=0
          while read -r sha; do
            subject=$(git log -1 --format=%s "$sha")
            author=$(git log -1 --format='%an <%ae>' "$sha")

            # A release PR carries version bumps and changelog text derived
            # mechanically from commits that were already signed off. There is
            # no new human contribution for anyone to certify, and release-plz
            # offers no way to add the trailer -- it has no commit-message or
            # signoff option.
            #
            # Both conditions below are set by GitHub, not by commit content,
            # so neither can be forged by a contributor: the PR author type
            # comes from the token that opened the pull request, and a bot
            # noreply address cannot be claimed by a push that GitHub did not
            # create. A human pushing a commit that merely names a bot as
            # author is still checked, because their pull request is not
            # authored by a bot.
            if [ "$PR_AUTHOR_TYPE" = "Bot" ] \
               && printf '%s' "$author" | grep -qE '\[bot\]@users\.noreply\.github\.com>$'; then
              echo "skip  ${sha:0:8}  $subject"
              echo "        bot-authored commit in a bot-authored pull request"
              continue
            fi

            # Any Signed-off-by matching the author, compared case-insensitively:
            # git does not normalise case, and a mismatched capitalisation is not
            # a missing sign-off.
            if git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" \
                 | grep -qiFx "$author"; then
              echo "ok    ${sha:0:8}  $subject"
            else
              failed=1
              echo "FAIL  ${sha:0:8}  $subject"
              echo "        author:      $author"
              echo "        signed-off:  $(git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" | paste -sd'; ' - || echo '(none)')"
            fi
          done <<< "$commits"

          if [ "$failed" -ne 0 ]; then
            cat <<'MSG'

          Every commit must carry a Signed-off-by trailer matching its author,
          certifying the Developer Certificate of Origin (https://developercertificate.org/).

          Add it to new commits with:
              git commit -s

          To fix commits already pushed:
              git rebase --signoff origin/<base branch>
              git push --force-with-lease
          MSG
            exit 1
          fi

          echo
          echo "All commits carry a matching Signed-off-by."
