# Local demonstration only: expose port 46357 on the host loopback interface.
tracing:
  log_level: info
runtime:
  n_cores: 0
  thread_name: slim-data-plane
  drain_timeout: 10s
services:
  slim/0:
    node_id: slim-server
    dataplane:
      servers:
        - endpoint: "0.0.0.0:46357"
          tls:
            insecure: true
      clients: []
