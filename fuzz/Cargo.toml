[package]
name = "a2a-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
a2a-client-lf = { path = "../a2a-client", features = ["fuzzing"] }
a2a-lf = { path = "../a2a", features = ["fuzzing"] }
a2a-pb = { path = "../a2a-pb" }
serde_json = "1"

[[bin]]
name = "sse_framing"
path = "fuzz_targets/sse_framing.rs"
test = false
doc = false
bench = false

[[bin]]
name = "protojson_roundtrip"
path = "fuzz_targets/protojson_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "agent_card_deserialize"
path = "fuzz_targets/agent_card_deserialize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "agent_card_roundtrip"
path = "fuzz_targets/agent_card_roundtrip.rs"
test = false
doc = false
bench = false
